<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Similar videos — oTube</title>
  {% include "_head.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>window.OTUBE = {{ app_settings|tojson }};</script>
  <style>:root { --sel-reach: {{ app_settings.selectReach|int }}px; }</style>
  <script>/* apply the app-wide display setting before first paint (no bright flash) */
  (function () { try { var d = JSON.parse(localStorage.getItem("otube.display") || "null") || (window.OTUBE || {}).display || {}, r = document.documentElement;
    var b = d.b || 1, c = d.c || 1;
    r.style.setProperty("--app-b", b); r.style.setProperty("--app-c", c);
    if (b < 1 || c != 1) r.classList.add("app-filter");
    r.style.setProperty("--app-warm", (d.n ? (d.w == null ? 50 : d.w) / 100 * 0.45 : 0).toFixed(3)); if (d.n) r.classList.add("app-night"); } catch (e) {} })();</script>
</head>
<body>
  <header class="topbar{% for k in ('topBrightness', 'topMini', 'topGom', 'topMode') %}{% if not app_settings[k] %} hide-{{ k }}{% endif %}{% endfor %}" data-tasks="{{ app_settings.topTasks }}">
    <div class="topbar__left">
      <button id="menu-toggle" class="icon-btn" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2Z"/></svg>
      </button>
      <a class="brand" href="/">
        <svg class="brand__mark" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#ff0033"/><circle cx="14" cy="14" r="8.2" fill="none" stroke="#fff" stroke-width="2.8"/><path d="M12 10.6v6.8l5.4-3.4z" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span class="brand__text"><span class="brand__o">o</span>Tube</span>
      </a>
    </div>
    <div class="topbar__right">
      {% include "_tasks.html" %}
      <div class="display-ctl">
        <button type="button" class="icon-btn" id="display-btn" aria-haspopup="dialog" aria-expanded="false" title="Display: brightness &amp; night light"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM2 13h2a1 1 0 0 0 0-2H2a1 1 0 0 0 0 2zm18 0h2a1 1 0 0 0 0-2h-2a1 1 0 0 0 0 2zM11 2v2a1 1 0 0 0 2 0V2a1 1 0 0 0-2 0zm0 18v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-2 0zM5.99 4.58a1 1 0 0 0-1.41 1.41l1.06 1.06a1 1 0 0 0 1.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 0 0-1.41 1.41l1.06 1.06a1 1 0 0 0 1.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 0 0-1.41-1.41l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 0 0-1.41-1.41l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06z"/></svg></button>
      </div>
      <button type="button" class="mode-btn mini-toggle" id="mini-toggle" aria-pressed="false"
              title="Mini player: play videos in a small player without leaving this page"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3a2 2 0 0 0-2 1.98V19c0 1.1.9 2 2 2h18a2 2 0 0 0 2-2zm-2 .02H3V4.97h18v14.05z"/></svg><span>Mini player</span></button>
      <button type="button" class="mode-btn mini-toggle gom-toggle" id="gom-toggle" aria-pressed="false"
              title="GOM Player: clicking a video plays it in GOM Player on this PC instead of here"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12zm-11-2 6-4-6-4v8z"/></svg><span>GOM</span></button>
      <button type="button" class="mode-btn {{ 'on' if private_on }}" id="mode-btn"
              data-private="{{ '1' if private_on else '0' }}" data-pin="{{ '1' if has_pin else '0' }}"
              title="{{ 'Private mode: showing only private folders. Click to go back to Family mode.' if private_on else 'Family mode: showing only public folders. Click to switch to Private mode.' }}">
        {% if private_on %}<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5h2a3 3 0 0 1 6 0v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5z"/></svg><span>Private</span>{% else %}<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3H9z"/></svg><span>Family</span>{% endif %}
      </button>
    </div>
  </header>

  {% set similar_page = True %}
  <div class="layout">
    {% include "_sidebar.html" %}

    <main class="content sv" id="sv" data-sizes="{{ sizes|tojson|forceescape }}">
      <section class="sv-scope" id="sv-scope" aria-labelledby="sv-scope-h">
        <button type="button" class="sv-scope__sum" id="sv-scope-sum" aria-expanded="true" aria-controls="sv-scope-body">
          <span class="sv-scope__h" id="sv-scope-h">What to search</span>
          <span class="sv-scope__line" id="sv-scope-line"></span>
          <svg class="sv-scope__chev" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
        <div class="sv-scope__body" id="sv-scope-body">
          <div class="sv-row"><span class="sv-row__label">Look in</span><div class="sv-chips" id="sv-include"></div></div>
          <div class="sv-row"><span class="sv-row__label">Leave out</span><div class="sv-chips" id="sv-exclude"></div></div>
          <div class="sv-row"><span class="sv-row__label" id="sv-min-l">Skip files smaller than</span>
            <div class="sv-seg" id="sv-min" role="radiogroup" aria-labelledby="sv-min-l"></div></div>
          <div class="sv-scope__foot"><button type="button" class="sv-btn" id="sv-scope-done">Done</button></div>
        </div>
      </section>

      <div class="sv-head">
        <h1 class="sv-title">Similar videos</h1>
        <div class="sv-seg" id="sv-level" role="radiogroup" aria-label="How alike videos must be">
          <button type="button" role="radio" data-level="strict" title="Only near-identical pictures match">Strict</button>
          <button type="button" role="radio" data-level="normal" title="Re-encoded and resized copies match">Normal</button>
          <button type="button" role="radio" data-level="loose" title="Also heavier re-encodes and colour changes (more false matches)">Loose</button>
        </div>
        <span class="sv-spacer"></span>
        <span class="sv-status" id="sv-status" aria-live="polite"></span>
        <button type="button" class="sv-btn" id="sv-cancel" hidden>Cancel</button>
        <button type="button" class="sv-btn primary" id="sv-analyse">Analyse new videos</button>
      </div>

      <div class="sv-summary" id="sv-summary">
        <span id="sv-sum-text">Loading…</span>
        <button type="button" class="sv-link" id="sv-mark-all" hidden>Mark all except the best of each</button>
      </div>

      <div class="sv-groups" id="sv-groups"></div>

      <div class="sv-bar" id="sv-bar" role="toolbar" aria-label="Marked videos" hidden>
        <span class="sv-bar__count" id="sv-bar-count"></span>
        <span class="sv-spacer"></span>
        <button type="button" class="sv-btn" id="sv-bar-clear">Unmark all</button>
        <button type="button" class="sv-btn danger" id="sv-bar-perm">Delete permanently…</button>
        <button type="button" class="sv-btn danger primary" id="sv-bar-recycle"></button>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="sv-pick" hidden>
    <div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="sv-pick-h">
      <div class="modal__head"><span id="sv-pick-h">Add folder</span>
        <button type="button" class="modal__close" data-close aria-label="Close">✕</button></div>
      <input type="search" class="sv-pick__filter" id="sv-pick-filter" placeholder="Filter folders" autocomplete="off" aria-label="Filter folders">
      <div class="sv-pick__list" id="sv-pick-list"></div>
    </div>
  </div>

  <div class="modal-overlay" id="browse-modal" hidden>
    <div class="modal">
      <div class="modal__head">
        <span>Add a video folder</span>
        <button class="modal__close" id="browse-close" aria-label="Close">✕</button>
      </div>
      <div class="browse-crumb" id="browse-crumb"></div>
      <div class="browse-list" id="browse-list"></div>
      <div class="modal__foot">
        <span class="browse-current" id="browse-current">Pick a folder</span>
        <button class="browse-add" id="browse-add" disabled>Add this folder</button>
      </div>
    </div>
  </div>

  {% set ctx_page = "similar" %}{% include "_ctx_menu.html" %}

  <script src="{{ url_for('static', filename='stream.js') }}"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script src="{{ url_for('static', filename='similar.js') }}"></script>
</body>
</html>
