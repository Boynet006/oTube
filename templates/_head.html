{# shared <head>: installable app (PWA) + watch progress shared across devices (sync.js) #}
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="oTube">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script>window.OTUBE_PROGRESS = {{ page_progress()|tojson }};
    if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });</script>
  <script src="{{ url_for('static', filename='sync.js') }}"></script>
