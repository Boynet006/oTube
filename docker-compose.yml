services:
  otube:
    build: .
    container_name: otube
    ports:
      - "8700:8700"
    volumes:
      - ./data:/data
      # Host video library -> /videos inside the container.
      # Add folders in the UI as /videos/<subfolder>.
      - "Q:/Old Drive 2/Videos:/videos"
      - "C:/Users/al_ha/Desktop/mrRobotSongs:/media/mrRobotSongs"
      # Every Windows drive (C:, E:, USB drives, ...) as /host/<letter>, so folders added in
      # the UI by their Windows path just work. This is Docker Desktop's own view of the
      # drives; "rslave" lets drives that show up later appear without a restart.
      - type: bind
        source: /run/desktop/mnt/host
        target: /host
        bind:
          propagation: rslave
    environment:
      - OTUBE_HOST_ROOT=/host
      # Set by start-otube.ps1 to http://<this PC's network IP>:8700 (Settings → Devices)
      - OTUBE_LAN_URL=${OTUBE_LAN_URL:-}
      # Where the other mounts live on the PC (for "Show in folder" / "Copy path")
      - OTUBE_PATH_MAP=/videos=Q:/Old Drive 2/Videos;/media/mrRobotSongs=C:/Users/al_ha/Desktop/mrRobotSongs
    restart: unless-stopped
